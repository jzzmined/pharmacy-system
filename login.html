<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap">

</head>
<body>

    <div class="container">

        <h2 class="title">Login</h2>
        <p class="subhead">The care you count on...</p>
        
        <form class="form" action="portfolio_task7.html" method="get" autocomplete="on">
            <input type="email" id="email" name="email" class="input-email" placeholder="Username" autocomplete="email" required>
            <input type="password" id="password" name="password" class="input-pass" placeholder="Password" autocomplete="current-password" required>
            <div class="remember-forgot">
                <label><input type="checkbox" name="remember" id="remember"> Remember me</label>
                <p class="forgot-pass">Forgot Password?</p>
            </div>
            <button type="submit" class="login_btn">Login</button>
        </form>

        <p class="text">
            <a href="register_task5.html" class="link">Register</a>
        </p>
    </div>

</body>
</html>
